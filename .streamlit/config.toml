[theme]
primaryColor = "#4A3525"
backgroundColor = "#FBF9F5"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#2B2118"
font = "sans serif"

[server]
port = 8501
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 500
maxMessageSize = 500

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "full"

[runner]
fastReruns = true
