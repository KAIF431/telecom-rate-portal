[theme]
primaryColor = "#0E7490"
backgroundColor = "#F0F9FF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0C4A6E"
font = "sans serif"

[server]
port = 8501
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 500
maxMessageSize = 500

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "full"

[runner]
fastReruns = true
