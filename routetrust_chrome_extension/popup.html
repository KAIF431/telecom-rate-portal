<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RouteTrust Auto-Pilot</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #1e293b;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 10px;
    }
    .header h2 {
      margin: 0;
      font-size: 16px;
      color: #0f172a;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #dcfce7;
      color: #166534;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 4px;
    }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    }
    .btn-launch {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
      margin-top: 10px;
    }
    .btn-launch:hover {
      background: #1d4ed8;
    }
    .features-list {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid #e2e8f0;
      font-size: 11px;
      color: #64748b;
      line-height: 1.5;
    }
    .features-list li {
      margin-bottom: 3px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 20px;">⚡</span>
    <h2>RouteTrust Auto-Pilot</h2>
  </div>

  <div class="status-badge">
    <div class="status-dot"></div>
    Auto-Pilot Engine Active
  </div>

  <div class="form-group">
    <label for="sub_id">Subscription ID:</label>
    <input type="text" id="sub_id" value="29168" placeholder="e.g. 29168 or 16415">
  </div>

  <button class="btn-launch" id="btn_open_upload">
    🚀 Open Upload Page
  </button>

  <div class="features-list">
    <b>Automated Steps:</b>
    <ul>
      <li>✅ Auto-selects <b>A to Z</b> rate deck type</li>
      <li>✅ Auto-submits when file selected</li>
      <li>✅ Auto-clicks <b>Use Vendor Date</b></li>
      <li>✅ Auto-clicks <b>Approve & Load</b></li>
    </ul>
  </div>

  <script src="popup.js"></script>
</body>
</html>
